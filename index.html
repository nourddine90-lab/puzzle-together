<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff4f8">
  <title>Hajour Together</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="konva.min.js"></script>
</head>
<body>

<section id="home">
  <h1>💕 Hajour Together</h1>
  <p class="sub" id="who" title="Change name"></p>

  <div class="modes">
    <button id="modePuzzle" class="modeBtn on">🧩 Puzzle</button>
    <button id="modeColor" class="modeBtn">🎨 Color</button>
  </div>

  <div class="card" id="puzzleCreate">
    <h2>New puzzle</h2>
    <label class="file"><input type="file" id="file" accept="image/*"><span id="fileLabel">📷 Choose a photo</span></label>
    <img id="preview" alt="" hidden>
    <p class="hint">How many pieces?</p>
    <div class="counts" id="counts"></div>
    <button id="create" class="primary" disabled>Create puzzle</button>
  </div>

  <div class="card" id="colorCreate" hidden>
    <h2>New coloring page</h2>
    <label class="file"><input type="file" id="photoFile" accept="image/*"><span id="photoFileLabel">📷 Upload your own photo</span></label>
    <p class="hint" id="photoHint">Works best on a simple, clear photo — one subject, not too busy.</p>
    <button id="blankPage" class="primary">✏️ Start on a blank page</button>
    <label class="file"><input type="file" id="tracePhotoFile" accept="image/*"><span id="tracePhotoLabel">🖼️ Or trace freely over a photo</span></label>
  </div>

  <div class="card">
    <h2>Join a room</h2>
    <div class="row">
      <input id="joinCode" placeholder="CODE" maxlength="6" autocomplete="off" autocapitalize="characters">
      <button id="join">Join</button>
    </div>
  </div>

  <div class="card">
    <h2>My rooms</h2>
    <ul id="list"></ul>
  </div>

  <p class="mode" id="mode"></p>
</section>

<section id="game" hidden>
  <div id="stage"></div>
  <header class="bar">
    <button id="back" class="icon" aria-label="Back">←</button>
    <div class="info"><b id="roomCode"></b><span id="progress"></span></div>
    <div id="players"></div>
    <button id="share" class="icon" aria-label="Invite">💌</button>
  </header>
  <div class="tools">
    <button id="ghost" class="icon" aria-label="Show picture">👁</button>
    <button id="zoomIn" class="icon" aria-label="Zoom in">＋</button>
    <button id="zoomOut" class="icon" aria-label="Zoom out">－</button>
    <button id="fit" class="icon" aria-label="Fit">⤢</button>
  </div>
  <div id="palette" hidden>
    <div class="panel" id="colorSheet" hidden>
      <div class="panelHead"><button id="closeColor" class="done" aria-label="Done">✓</button><b>Color</b></div>
      <div class="ringWrap">
        <div id="hueRing"></div>
        <div id="ringHole"><span id="colorPreview"></span></div>
        <span id="ringKnob"></span>
      </div>
      <input type="range" id="lightInput" class="shadeSlider" min="8" max="92" value="55" aria-label="Shade">
      <div class="swatchGrid" id="swatchGrid"></div>
      <p class="panelLabel" id="recentLabel">Recent</p>
      <div class="swatchGrid" id="recentGrid"></div>
    </div>

    <div class="panel small" id="brushPop" hidden>
      <div class="brushTypes" id="brushTypeRow">
        <button id="brushMarker" class="on"><span>🖊️</span>Marker</button>
        <button id="brushCrayon"><span>🖍️</span>Crayon</button>
        <button id="brushWater"><span>💧</span>Water</button>
      </div>
      <div class="sizeRow">
        <span class="sizePreview"><span id="sizeDot"></span></span>
        <div class="sizeCol">
          <b id="brushPopTitle">Brush</b>
          <input type="range" id="brushSizeInput" min="4" max="40" value="12" aria-label="Size">
        </div>
      </div>
    </div>

    <div class="toolbar">
      <button id="colorBtn" class="tool" aria-label="Color"><span id="colorChip"></span></button>
      <button id="toolFill" class="tool" aria-label="Fill">🪣</button>
      <button id="toolBrush" class="tool" aria-label="Brush">🖌️</button>
      <button id="eraser" class="tool" aria-label="Eraser">🧽</button>
      <button id="undoBtn" class="tool" aria-label="Undo">↩️</button>
      <button id="clearPage" class="tool" aria-label="Clear everything">🗑️</button>
    </div>
  </div>
  <div id="win" hidden>
    <div>
      <h2>🎉 Bravo!</h2>
      <p>You finished it together.</p>
      <button id="winClose" class="primary">Admire it</button>
    </div>
  </div>
</section>

<div id="nameDlg" class="modal" hidden>
  <div class="card">
    <h2>Who's playing?</h2>
    <input id="nameIn" placeholder="Your name" maxlength="16" autocomplete="off">
    <div id="swatches"></div>
    <button id="nameOk" class="primary">Let's go</button>
  </div>
</div>

<div id="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
